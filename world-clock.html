<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap');

:root {
  --bg: #f7f3ea;
  --bgAlt: #fbf8f0;
  --surface: #ffffff;
  --border: #e2d9c5;
  --borderStrong: #c4b89c;
  --text: #1d160f;
  --textMute: #5a4d38;
  --textDim: #8a7d65;
  --textFaint: #b8aa90;
  --accent: #8a6614;
  --accentBright: #b8862f;
  --accentSoft: rgba(184, 134, 47, 0.4);
  --accentBg: rgba(184, 134, 47, 0.08);
  --rust: #a84a3c;
  --rustSoft: rgba(168, 74, 60, 0.4);
  --rustBg: rgba(168, 74, 60, 0.06);
  --status-work: #4a7c59;
  --status-edge: #c97b3a;
  --status-off: #b04942;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Hanken Grotesk", system-ui, sans-serif;
  min-height: 100vh;
}

.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
.tracked { letter-spacing: 0.18em; font-size: 11px; font-weight: 500; }
.small { font-size: 11px; }
.micro { font-size: 9px; letter-spacing: 0.1em; }
.dim { color: var(--textDim); }

.heroTime {
  font-size: clamp(54px, 11vw, 88px);
  font-weight: 300;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--text);
}
.heroColon { color: var(--accent); margin: 0 4px; }
.heroSeconds { color: var(--textFaint); font-size: 0.45em; margin-left: 6px; letter-spacing: 0.05em; }
.heroCity {
  font-family: "Fraunces", Georgia, serif;
  font-size: 17px;
  letter-spacing: -0.01em;
  font-variation-settings: "SOFT" 50;
  color: var(--text);
}
.heroDot { color: var(--textFaint); }

.cardTime {
  font-size: 36px;
  font-weight: 300;
  letter-spacing: -0.03em;
  color: var(--text);
  line-height: 1;
}
.cardDate {
  margin-top: 2px;
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.02em;
}

.addCard:hover {
  border-color: var(--accent);
  background: var(--accentBg);
  color: var(--accent);
}
.addCardLabel {
  font-family: "Fraunces", Georgia, serif;
  font-size: 16px;
  margin-top: 4px;
}
.addCardSub { font-size: 11px; }

.removeBtn:hover {
  background: var(--rustBg);
  color: var(--rust);
}

.cityItem:hover {
  background: var(--accentBg);
}

.hourSlider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  background: transparent;
  outline: none;
  cursor: pointer;
}
.hourSlider::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--border);
  border-radius: 1px;
}
.hourSlider::-moz-range-track {
  height: 2px;
  background: var(--border);
  border-radius: 1px;
}
.hourSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accentBright);
  border: 2px solid var(--bg);
  margin-top: -6px;
  cursor: grab;
  box-shadow: 0 0 0 1px var(--accent), 0 2px 6px rgba(138, 102, 20, 0.2);
  transition: transform 0.15s;
}
.hourSlider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.2); }
.hourSlider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accentBright);
  border: 2px solid var(--bg);
  cursor: grab;
  box-shadow: 0 0 0 1px var(--accent), 0 2px 6px rgba(138, 102, 20, 0.2);
}

#loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  color: var(--textDim);
  font-size: 13px;
  letter-spacing: 0.1em;
}

@media (max-width: 480px) {
  .heroTime { font-size: 60px; }
  .cardTime { font-size: 30px; }
}
</style>
</head>
